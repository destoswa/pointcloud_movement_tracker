production:
  src_csv: default   # path to CSV pairing fil
  do_merge_results: True
  postprocess_only: True
  do_skip_existing: False
  do_preprocessing: False   
  prefix: Brienz
  verbose: False
preprocessing:                 # whether to run preprocessing to auto-pair old/new files
  src_folder_old: D:\Terranum_SD\99_Data\PC_movement_tracking\Doldenhorn\tiles\old   # path to folder containing the older point clouds
  src_folder_new: D:\Terranum_SD\99_Data\PC_movement_tracking\Doldenhorn\tiles\new   # path to folder containing the newer point clouds
  src_res: default
  pattern: "*_*_(dddd_dddd/dddd-dddd)_*"    # place here a regular expression (regex) that identify the common part of each pair
  verbose: True                             # print preprocessing progress and matched pairs
